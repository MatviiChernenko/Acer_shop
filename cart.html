<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик — Acer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 px-3 px-md-5">
        <div class="container-fluid p-0 d-flex align-items-center justify-content-between">
            <a class="navbar-brand d-flex align-items-center gap-3 m-0" href="index.html">
                <img src="images/Logo_Acer 1.svg" alt="Acer" height="35">
                <span class="brand-slogan ps-2 text-start">
                    Товари<br>від Acer
                </span>
            </a>

            <button class="navbar-toggler border-0 p-0 d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-none d-lg-flex invisible-on-mobile">
                <ul class="navbar-nav gap-3 gap-xl-5 flex-row">
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link text-dark px-0 fw-semibold" href="cart.html">Кошик</a></li>
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="index.html#catalog">Товари</a></li>
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="#">Підтримка</a></li>
                </ul>
            </div>

            <div class="offcanvas offcanvas-top d-lg-none custom-dropdown-menu" tabindex="-1" id="mobileMenu">
                <div class="offcanvas-header justify-content-end py-3 px-4">
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body pb-4">
                    <div class="d-flex flex-column gap-3 text-center align-items-center">
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="index.html">Головна</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="cart.html">Кошик</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="#catalog">Товари</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="#support">Підтримка</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold m-0">Ваш кошик</h1>
            <button id="clear-cart-btn" class="btn btn-outline-secondary btn-sm d-none">Очистити кошик</button>
        </div>

        <div id="cart-list" class="cart-list d-flex flex-column gap-3"></div>

        <div id="cart-summary" class="mt-4 pt-4 border-top d-none">
            <div class="row g-4 justify-content-between align-items-start">
                <div class="col-lg-6">
                    <form id="checkout-form" class="p-4 border rounded-3 bg-light">
                        <h2 class="h5 fw-bold mb-3">Оформлення замовлення</h2>
                        <div class="mb-3">
                            <label for="customer-name" class="form-label">Ім'я та прізвище</label>
                            <input type="text" id="customer-name" class="form-control" required placeholder="Олександр Коваленко">
                        </div>
                        <div class="mb-3">
                            <label for="customer-phone" class="form-label">Телефон</label>
                            <input type="tel" id="customer-phone" class="form-control" required placeholder="+380 (XX) XXX-XX-XX">
                        </div>
                        <div class="mb-3">
                            <label for="customer-city" class="form-label">Місто / відділення доставки</label>
                            <input type="text" id="customer-city" class="form-control" required placeholder="Малин, відділення №1">
                        </div>
                        <button type="submit" class="btn btn-gradient text-white fw-semibold px-4 py-2 rounded-2 w-100">
                            Підтвердити замовлення
                        </button>
                    </form>
                </div>

                <div class="col-lg-5">
                    <div class="p-4 border rounded-3 bg-white">
                        <div class="d-flex justify-content-between align-items-center mb-2 text-muted">
                            <span>Товарів у кошику:</span>
                            <span id="cart-items-count">0 шт.</span>
                        </div>
                        <div id="cart-total-value" class="fs-4 fw-bold text-dark mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="order-success" class="alert alert-success mt-4 d-none" role="alert">
            <h4 class="alert-heading">Замовлення оформлено!</h4>
            <p class="mb-0">Дякуємо за покупку. Менеджер зв'яжеться з вами найближчим часом.</p>
        </div>
    </main>

    <footer class="border-top py-4 text-center text-muted bg-white mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Acer. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="cartApp.js"></script>
</body>
</html>
