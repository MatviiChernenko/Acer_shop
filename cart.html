<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acer goods</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="cart.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 px-3 px-md-5">
        <div class="container-fluid p-0 d-flex align-items-center justify-content-between">
            
            <a class="navbar-brand d-flex align-items-center gap-3 m-0" href="#">
                <img src="path-to-acer-logo.png" alt="Acer" height="35">
                <span class="fw-bold text-dark fs-7 fs-sm-6 text-uppercase ps-3 text-start line-height-tight">
                    Товари<br>від Acer
                </span>
            </a>
            
            <button class="navbar-toggler border-0 p-0 d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-none d-lg-flex invisible-on-mobile">
                <ul class="navbar-nav gap-3 gap-xl-5 flex-row">
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="#">Головна</a></li>
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="#">Товари</a></li>
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="#">Контакти</a></li>
                    <li class="nav-item"><a class="nav-link text-dark px-0" href="#">Підтримка</a></li>
                </ul>
            </div>

            <div class="offcanvas offcanvas-top d-lg-none custom-dropdown-menu" tabindex="-1" id="mobileMenu">
                <div class="offcanvas-header justify-content-end py-3 px-4">
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body pb-4">
                    <div class="d-flex flex-column gap-3 text-center align-items-center">
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="#">Головна</a>
                        <a href="cart.html" class="text-decoration-none text-dark fs-5 fw-medium py-1" href="#">Товари</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="#">Контакти</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="#">Підтримка</a>
                    </div>
                </div>
            </div>

        </div>
    </nav>

    <main>
        <div class="cart-list">
            <div class="product">
                <div class="product-img">
                    <img src="path-to-product-image.jpg" alt="Product Image">
            </div>
            <div class="product-title">
                <h3>title</h3>
            </div>
            <div class="quantity-control">
                <button class="quantity-minus">-</button>
                <span class="quantity">0</span>
                <button class="quantity-plus">+</button>
            </div>
            <div class="remove">
                <button class="remove-btn">X</button>   
            </div>
        </div>
    </main>
    <footer">
        <p >&copy; 2026 Acer. All rights reserved.</p>
    </footer>
        
    
</body>
</html>
