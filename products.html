<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товари — Acer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 px-3 px-md-5">
        <div class="container-fluid p-0 d-flex align-items-center justify-content-between">
            <a class="navbar-brand d-flex align-items-center gap-3 m-0" href="index.html">
                <img src="images/Logo_Acer 1.svg" alt="Acer" height="35">
                <span class="brand-slogan ps-2 text-start">
                    Товари<br>від Acer
                </span>
            </a>

            <button class="navbar-toggler border-0 p-0 d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-none d-lg-flex invisible-on-mobile">
                <ul class="navbar-nav gap-3 gap-xl-5 flex-row">
                    <li class="nav-item"><a class="nav-link px-0" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link px-0" href="cart.html">Кошик</a></li>
                    <li class="nav-item"><a class="nav-link px-0" href="products.html">Товари</a></li>
                    <li class="nav-item"><a class="nav-link px-0" href="index.html#support">Підтримка</a></li>
                </ul>
            </div>

            <div class="offcanvas offcanvas-top d-lg-none custom-dropdown-menu" tabindex="-1" id="mobileMenu">
                <div class="offcanvas-header justify-content-end py-3 px-4">
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body pb-4">
                    <div class="d-flex flex-column gap-3 text-center align-items-center">
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="index.html">Головна</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="cart.html">Кошик</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="products.html">Товари</a>
                        <a class="text-decoration-none text-dark fs-5 fw-medium py-1" href="index.html#support">Підтримка</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <h1 class="h2 fw-bold mb-4">Усі товари Acer</h1>

        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <input type="text" id="search-input" class="form-control" placeholder="Пошук за назвою...">
            </div>
            <div class="col-md-4">
                <select id="sort-select" class="form-select">
                    <option value="default">Без сортування</option>
                    <option value="price-asc">Спочатку дешевші</option>
                    <option value="price-desc">Спочатку дорожчі</option>
                </select>
            </div>
        </div>

        <section id="products-container" class="row g-4"></section>
    </main>

    <footer class="border-top py-4 text-center text-muted bg-white mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Acer. All rights reserved.</p>
        </div>
    </footer>

    <div id="cart-toast" class="cart-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="products.js"></script>
</body>
</html>
